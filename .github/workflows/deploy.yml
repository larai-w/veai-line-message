# A push to main updates the code of line-message-function.
#
# Authentication is OIDC (moved 2026-08-18). No long-lived access key.
# Permissions are limited to lambda:UpdateFunctionCode on line-message-function,
# so this workflow cannot change environment variables.
#
# Required secrets: AWS_DEPLOY_ROLE_ARN
name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  # For a manual redeploy: recovering from an incident, and checking a change
  # around authentication.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needed to assume the role via OIDC
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create deployment zip
        run: zip function.zip index.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name line-message-function \
            --zip-file fileb://function.zip
