# main への push で line-message-function のコードを更新する。
#
# 認証は OIDC（2026-08-18 移行）。長期アクセスキーは使わない。
# 権限は lambda:UpdateFunctionCode を line-message-function に限定しているため、
# このワークフローは環境変数を変更できない。
#
# 必要な Secrets: AWS_DEPLOY_ROLE_ARN
name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC でロールを引き受けるために必要
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create deployment zip
        run: zip function.zip index.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name line-message-function \
            --zip-file fileb://function.zip
